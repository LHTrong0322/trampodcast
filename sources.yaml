# =====================================================================
#  CẤU HÌNH PODCAST, sửa file này là đủ, không cần đụng vào code.
#  Thêm/bớt nguồn: thêm/xoá 1 dòng. Dòng bắt đầu bằng # là ghi chú.
# =====================================================================

podcast:
  name: "Trạm Podcast Crypto"
  host_name: "Mai Hương"       # tên cô MC trong kịch bản
  region: "Hà Nội"             # MC là người vùng nào (ảnh hưởng cách nói trong kịch bản)
  particles: "nhé, nhỉ, đấy, ạ, ơi, ôi, hihi"   # tiểu từ hay dùng

  # Dịch vụ đọc giọng: "gemini" (miễn phí) hoặc "elevenlabs" (giọng Việt thật, trả phí)
  tts_provider: "gemini"
  author: "Trọng"
  # Giọng đọc Gemini (tên giọng xem trong AI Studio → Playground), vd Fola, Leda, Puck
  voice: "Fola"
  # Để trống = đọc tự nhiên y như lúc nghe thử trên AI Studio.
  # Muốn chỉnh "diễn xuất" thì viết mô tả (tiếng Anh) vào giữa hai dấu ngoặc kép.
  voice_style: ""
  target_minutes: 12           # độ dài mong muốn mỗi tập (phút)
  max_stories: 25              # số tin tối đa mỗi tập (web + Telegram hiện đủ, kèm link nguồn)
  max_other_news: 40           # "Tin khác" trên web: tóm tắt 1 câu, không đọc trong audio
  history_episodes: 3          # chống lặp: so với tin của bao nhiêu tập gần nhất
  deep_stories: 8              # số tin nóng nhất được đọc kỹ; các tin còn lại đọc nhanh 1 câu
  lookback_hours: 26           # gom tin trong bao nhiêu giờ gần nhất (1 tập/ngày → 24h + dư 2h)
  keep_episodes: 40            # giữ bao nhiêu tập gần nhất (tập cũ tự xoá)

# Giọng VieNeu-TTS (mã nguồn mở, miễn phí, chạy trên GitHub): dùng khi tts_provider: "vieneu"
# Giọng có sẵn, Bắc: Minh Đức, Phạm Tuyên, Xuân Vĩnh, Thanh Bình, Ngọc Linh, Đoan Trang, Quỳnh Anh,
# Quốc Tuấn · Trung: Quang Sơn, Ngọc Trân · Nam: Adam, Thái Sơn, Thục Đoan, Minh Triết, Mỹ Duyên,
# Đức Trí, Kim Thanh · Nổi bật: Trúc Ly, Thiện Minh, Mai Anh, Hải Đăng, Thùy Dung, Ngọc Huyền...
vieneu:
  voice: "Mai Anh"

# Cấu hình ElevenLabs (chỉ dùng khi tts_provider: "elevenlabs")
elevenlabs:
  voice_id: "iR5k1BKfxyFKNJ628A79"     # copy Voice ID từ ElevenLabs
  model: "eleven_multilingual_v2"      # hoặc "eleven_v3" (biểu cảm hơn)
  stability: 0.45                      # thấp = nhiều cảm xúc hơn, cao = đều giọng hơn
  similarity_boost: 0.8
  style: 0.35                          # cao = "diễn" nhiều hơn
  speed: 1.0                           # 0.7-1.2

# Model AI (tự thử lần lượt, model đầu lỗi/không tồn tại thì dùng model sau)
models:
  text: ["gemini-3-flash-preview", "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
  tts:  ["gemini-3.8-flash-tts"]   # giọng Fola chỉ có trên model này

# ---------------------------------------------------------------------
#  Kênh Telegram, ghi username (phần sau t.me/).
#  Nếu đã bật USERBOT (xem README): đọc được cả kênh private / tắt preview,
#  với kênh private không có username thì ghi ID dạng -100xxxxxxxxxx
# ---------------------------------------------------------------------
telegram:
