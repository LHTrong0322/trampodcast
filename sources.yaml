x_rss:
  # - { name: "X @CryptoWendyO", url: "https://rss.app/feeds/XXXXXXXX.xml" }

# ---------------------------------------------------------------------
#  VIDEO TỔNG HỢP TUẦN (dùng lượt Gemini còn dư sau podcast mỗi ngày)
# ---------------------------------------------------------------------
video:
  enabled: false              # Trọng 23/11: DỪNG video tổng hợp tuần (không làm sẵn đoạn video hằng ngày nữa)
  stories_per_day: 3          # mỗi ngày làm sẵn đoạn video cho bao nhiêu tin nóng nhất (1 lượt đọc)
  max_weekly_stories: 12      # video ngang tối đa bao nhiêu tin
  shorts: 4                   # số video dọc 9:16 (Reels/Shorts) mỗi tuần
  image_seconds: 4            # mỗi ảnh hiện bao nhiêu giây rồi đổi ảnh mới
  music: true                 # nhạc nền lo-fi tự sáng tác (không bản quyền)
  music_volume: 0.22          # âm lượng nhạc nền (0.1 = rất nhỏ, 0.35 = rõ)
  shorts_speed: 1.08          # video dọc đọc nhanh hơn 8%
  shorts_max_seconds: 30      # video dọc tối đa bao nhiêu giây

# ---------------------------------------------------------------------
#  TIN NÓNG 4 TIẾNG (Trọng 23/11, news_flash.py + .github/workflows/news-flash.yml)
#  Cứ 4 tiếng lọc tin: chỉ tin CỰC KỲ quan trọng hoặc rất dễ viral mới viết kịch bản short.
#  Kịch bản gửi Telegram để Trọng duyệt (nút ✅ / ❌ hoặc /duyet, /bo, /sua), duyệt xong mới dựng
#  short 9:16 theo bộ khung Smart Penguin Insights, giọng xịn Ludo KOL như video đã duyệt, gửi lại Telegram. Không tự đăng.
# ---------------------------------------------------------------------
news_flash:
  enabled: true
  voice: "gemini:Ludo@kol"   # Trọng 24/11: giọng xịn như video đã duyệt (Hải Đăng chỉ là nháp). Gemini hết lượt thì dừng, báo Telegram (luật 20/11)
  min_importance: 9           # điểm quan trọng tối thiểu (thang 10) để làm video
  min_viral: 9                # hoặc điểm "câu view" tối thiểu (thang 10)
  max_per_day: 3              # tối đa bao nhiêu kịch bản tin nóng mỗi ngày
  expire_hours: 10            # kịch bản chờ duyệt quá bao lâu thì bỏ (tin đã cũ)
  lookback_hours: 5           # mỗi lần lọc xem tin trong bao nhiêu giờ gần nhất
  short_cta: "Theo dõi Smart Penguin Insights để không lỡ tin nóng nhé!"

# ---------------------------------------------------------------------
#  TRẠM INSIGHT, link bài X → video chia sẻ insight
#  Trọng 23/11: đã bỏ gom link qua Telegram (/list, /cook, tự cook buổi tối). Nhập link khi bấm chạy insight.yml.
# ---------------------------------------------------------------------
insight:
  enabled: true
  name: "Smart Penguin Insights"   # tên kênh (AI dùng khi chào / kết)
  brand: "Smart Penguin Insights"
  title_tag: "INSIGHT CRYPTO"
  outro_line: "Đăng ký Smart Penguin Insights để nhận insight crypto mỗi tuần"
  cta_v: "Xem full trên YouTube · @Trong0322"
  voice_primary: "gemini:Ludo@kol"       # Trọng chốt 23/11: giọng Ludo KOL giọng Bắc nghiêm túc (lời dặn ở voice_ludo2.STYLE["kol"]) cho MỌI video về sau. Không đổi.
  voice_fallback: "vieneu:Hải Đăng"  # chỉ dùng khi Gemini hết lượt, cả video đổi sang giọng này
  voice_speed: {gemini: 1.0, vieneu: 1.0}   # Trọng chọn giọng Ludo KOL 21/11: giữ nguyên tốc độ đọc
  target_wpm: 228            # nhịp nhanh vừa, giữ chân người xem
  tts_provider: "gemini"      # (bộ dựng cũ) "gemini" hoặc "vieneu"
  vieneu_voice: "Hải Đăng"
  voice: "Ludo"
  voice_style: ""             # để trống = đọc tự nhiên
  host_name: ""               # tên người dẫn (để trống = không xưng tên)
  host_desc: "điềm đạm, sâu sắc, gần gũi như một người anh đi trước chia sẻ kinh nghiệm"
  self_word: "mình"
  audience: "mọi người"
  min_posts: 3                # đủ bao nhiêu link thì tối đó tự cook video
  max_posts: 8                # mỗi video dùng tối đa bao nhiêu bài
  max_sections: 6             # số insight tối đa trong 1 video
  target_minutes: 7
  shorts: 5                   # số video ngắn tối đa (kịch bản đã duyệt chọn phần nào làm short, Trọng 22/11: mỗi short lấy trọn 1 phần)
  shorts_max_seconds: 59      # dưới 60s để 1 file đăng được YouTube, Facebook, TikTok
  short_cta: "Xem full video trên kênh Smart Penguin Insights nhé!"   # câu đọc + chữ lớn cuối MỌI short (Trọng 22/11)
  subtitle_lang: "vi"         # phụ đề: vi = tiếng Việt theo câu đầy đủ, khớp lời đọc (Trọng chốt 20/11) · en = tiếng Anh
  theme: "light"               # nền video: dark | light (sáng) | blue (xanh đại dương) | slate (xám xanh)
  review_model: "claude-sonnet-5-5"   # bot review dùng Claude (secret ANTHROPIC_API_KEY); chưa có key thì tạm dùng Gemini
  end_screen_seconds: 12              # khoảng cuối video để gắn màn hình kết thúc YouTube
  cook_hours: [19, 23]        # khung giờ (VN) được phép cook tự động
  # ---- Cấu hình xuất bản theo nền tảng (platform_export.py, chạy trước khi tạo Release) · tra cứu 20/11/2026 ----
  # Nguồn: support.google.com/youtube/answer/1722171 (mã hoá), /answer/15424877 (Shorts 3 phút),
  #        /answer/72431 (ảnh bìa); postfa.st + manypixels.co (TikTok, Reels: tổng hợp từ tài liệu TikTok/Meta).
  publish:
    strict: true                  # sai thông số → dừng, không tạo Release (báo lỗi Telegram)
    long:                         # video dài YouTube 16:9
      width: 2560                 # 1440p: YouTube cấp codec VP9 (nét hơn AVC1) cho video tải lên từ 1440p
      height: 1440
      fallback_height: 1080       # vẫn chấp nhận 1080p nếu sau này đổi về
      fps: 30
      crf: 16                     # chất lượng (càng nhỏ càng nét); trần bitrate bên dưới
      maxrate: "24M"              # YouTube khuyên 16 Mbps cho 1440p30 → để dư
      bufsize: "48M"
      preset: "fast"              # ~1,2 phút mã hoá / 1 phút video trên máy GitHub 4 nhân
    short:                        # 1 file dùng chung YouTube Shorts / TikTok / Facebook Reels
      width: 1080
      height: 1920
      fps: 30
      crf: 17
      maxrate: "12M"              # YouTube khuyên 8 Mbps cho 1080p30
      bufsize: "24M"
      preset: "medium"
      warn_seconds: 60            # Shorts > 60s dính bản quyền nhạc có thể bị chặn → cảnh báo
      max_seconds: 180            # Shorts tối đa 3 phút (quá → YouTube xếp thành video thường) → lỗi
    audio:
      sample_rate: 48000          # YouTube: 48 kHz
      channels: 2                 # stereo
      bitrate: "384k"             # YouTube khuyên 384 kbps cho stereo
      lufs: -14.0                 # độ lớn tích hợp; YouTube/TikTok/Reels đều chuẩn hoá về khoảng -14
      true_peak: -1.0             # đỉnh thật tối đa (dBTP) tránh rè khi nền tảng nén lại
      lra: 11.0
      lufs_tolerance: 1.5
    thumb: {width: 1280, height: 720, max_bytes: 2000000}   # ảnh bìa YouTube: 1280x720, dưới 2MB
    vertical_cover: true          # thêm ảnh bìa dọc 1080x1920 (khung hook) cho từng short
    vertical_cover_at: 1.2        # lấy khung hình ở giây thứ 1,2
  # Độ dài short khuyên dùng: 30-45s (shorts_max_seconds ở trên = 45). Giữ dưới 60s để 1 file đăng được cả 3 nơi
  # mà không dính rủi ro bản quyền Shorts > 1 phút; TikTok/Reels không giới hạn chặt nhưng video ngắn giữ chân tốt hơn.
  # Vùng an toàn khung dọc 1080x1920 (px tính từ mép): chữ/số quan trọng KHÔNG đặt ngoài vùng này vì bị nút,
  # tên kênh, caption của ứng dụng che. right_buttons = cột nút (tim, bình luận, chia sẻ) ở nửa dưới bên phải.
  safe_zones:
    tiktok:         {top: 240, bottom: 660, left: 120, right: 120, right_buttons: 180}   # TikTok In-Feed template
    reels:          {top: 269, bottom: 672, left: 65,  right: 65,  right_buttons: 180}   # Meta: 14% / 35% / 6%
    youtube_shorts: {top: 285, bottom: 285, left: 0,   right: 0,   right_buttons: 180}   # "giữ nội dung trong 4:5 ở giữa"
    common:         {top: 285, bottom: 672, left: 120, right: 180}  # GIAO cả 3 → dùng cho 1 file chung: vùng x 120-900, y 285-1248
