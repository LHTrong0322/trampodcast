# =====================================================================
#  CẤU HÌNH PODCAST — sửa file này là đủ, không cần đụng vào code.
#  Thêm/bớt nguồn: thêm/xoá 1 dòng. Dòng bắt đầu bằng # là ghi chú.
# =====================================================================

podcast:
  name: "Trạm Podcast Crypto"
  host_name: "Mai Hương"       # tên cô MC trong kịch bản
  region: "Hà Nội"             # MC là người vùng nào (ảnh hưởng cách nói trong kịch bản)
  particles: "nhé, nhỉ, đấy, ạ, ơi, ôi, hihi"   # tiểu từ hay dùng

  # Dịch vụ đọc giọng: "gemini" (miễn phí) hoặc "elevenlabs" (giọng Việt thật, trả phí)
  tts_provider: "gemini"
  author: "Trọng"
  # Giọng đọc Gemini (tên giọng xem trong AI Studio → Playground), vd Fola, Leda, Puck
  voice: "Fola"
  # Để trống = đọc tự nhiên y như lúc nghe thử trên AI Studio.
  # Muốn chỉnh "diễn xuất" thì viết mô tả (tiếng Anh) vào giữa hai dấu ngoặc kép.
  voice_style: ""
  target_minutes: 12           # độ dài mong muốn mỗi tập (phút)
  max_stories: 25              # số tin tối đa mỗi tập (web + Telegram hiện đủ, kèm link nguồn)
  max_other_news: 40           # "Tin khác" trên web: tóm tắt 1 câu, không đọc trong audio
  history_episodes: 3          # chống lặp: so với tin của bao nhiêu tập gần nhất
  deep_stories: 8              # số tin nóng nhất được đọc kỹ; các tin còn lại đọc nhanh 1 câu
  lookback_hours: 26           # gom tin trong bao nhiêu giờ gần nhất (1 tập/ngày → 24h + dư 2h)
  keep_episodes: 40            # giữ bao nhiêu tập gần nhất (tập cũ tự xoá)

# Giọng VieNeu-TTS (mã nguồn mở, miễn phí, chạy trên GitHub): dùng khi tts_provider: "vieneu"
# Giọng có sẵn — Bắc: Minh Đức, Phạm Tuyên, Xuân Vĩnh, Thanh Bình, Ngọc Linh, Đoan Trang, Quỳnh Anh,
# Quốc Tuấn · Trung: Quang Sơn, Ngọc Trân · Nam: Adam, Thái Sơn, Thục Đoan, Minh Triết, Mỹ Duyên,
# Đức Trí, Kim Thanh · Nổi bật: Trúc Ly, Thiện Minh, Mai Anh, Hải Đăng, Thùy Dung, Ngọc Huyền...
vieneu:
  voice: "Mai Anh"

# Cấu hình ElevenLabs (chỉ dùng khi tts_provider: "elevenlabs")
elevenlabs:
  voice_id: "iR5k1BKfxyFKNJ628A79"     # copy Voice ID từ ElevenLabs
  model: "eleven_multilingual_v2"      # hoặc "eleven_v3" (biểu cảm hơn)
  stability: 0.45                      # thấp = nhiều cảm xúc hơn, cao = đều giọng hơn
  similarity_boost: 0.8
  style: 0.35                          # cao = "diễn" nhiều hơn
  speed: 1.0                           # 0.7 – 1.2

# Model AI (tự thử lần lượt, model đầu lỗi/không tồn tại thì dùng model sau)
models:
  text: ["gemini-3-flash-preview", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
  tts:  ["gemini-3.8-flash-tts"]   # giọng Fola chỉ có trên model này

# ---------------------------------------------------------------------
#  Kênh Telegram — ghi username (phần sau t.me/).
#  Nếu đã bật USERBOT (xem README): đọc được cả kênh private / tắt preview,
#  với kênh private không có username thì ghi ID dạng -100xxxxxxxxxx
# ---------------------------------------------------------------------
telegram:
  - unfolded
  - Fivemincryptoann
  - ThuanCapital
  - WatcherGuru              # breaking news nhanh
  - wublockchainenglish      # Wu Blockchain: tin Châu Á, sàn, chính sách

# ---------------------------------------------------------------------
#  Trang tin crypto uy tín (RSS)
# ---------------------------------------------------------------------
rss:
  - { name: "CoinDesk",         url: "https://www.coindesk.com/arc/outboundfeeds/rss/" }
  - { name: "The Block",        url: "https://www.theblock.co/rss.xml" }
  - { name: "Cointelegraph",    url: "https://cointelegraph.com/rss" }
  - { name: "Decrypt",          url: "https://decrypt.co/feed" }
  - { name: "Blockworks",       url: "https://blockworks.co/feed" }
  - { name: "DL News",          url: "https://www.dlnews.com/arc/outboundfeeds/rss/" }
  - { name: "The Defiant",      url: "https://thedefiant.io/api/feed" }
  - { name: "Bitcoin Magazine", url: "https://bitcoinmagazine.com/.rss/full/" }

# ---------------------------------------------------------------------
#  Tài khoản X (Twitter): X không cho đọc miễn phí, nên cần 1 link RSS
#  tạo từ dịch vụ như rss.app (xem README, mục "Thêm nguồn X").
#  Bỏ dấu # ở dòng dưới và dán link RSS của bạn vào.
# ---------------------------------------------------------------------
x_rss:
  # - { name: "X @CryptoWendyO", url: "https://rss.app/feeds/XXXXXXXX.xml" }

# ---------------------------------------------------------------------
#  VIDEO TỔNG HỢP TUẦN (dùng lượt Gemini còn dư sau podcast mỗi ngày)
# ---------------------------------------------------------------------
video:
  enabled: true
  stories_per_day: 3          # mỗi ngày làm sẵn đoạn video cho bao nhiêu tin nóng nhất (1 lượt đọc)
  max_weekly_stories: 12      # video ngang tối đa bao nhiêu tin
  shorts: 4                   # số video dọc 9:16 (Reels/Shorts) mỗi tuần
  image_seconds: 4            # mỗi ảnh hiện bao nhiêu giây rồi đổi ảnh mới
  music: true                 # nhạc nền lo-fi tự sáng tác (không bản quyền)
  music_volume: 0.22          # âm lượng nhạc nền (0.1 = rất nhỏ, 0.35 = rõ)
  shorts_speed: 1.08          # video dọc đọc nhanh hơn 8%
  shorts_max_seconds: 30      # video dọc tối đa bao nhiêu giây

# ---------------------------------------------------------------------
#  TRẠM INSIGHT — gửi link bài X chất lượng vào bot Telegram → video chia sẻ insight
#  Lệnh trong Telegram: gửi link (nhiều link 1 lúc cũng được) · /list xem link đang chờ · /cook làm ngay
# ---------------------------------------------------------------------
insight:
  enabled: true
  name: "Smart Penguin Insights"   # tên kênh (AI dùng khi chào / kết)
  brand: "Smart Penguin Insights"
  title_tag: "INSIGHT CRYPTO"
  outro_line: "Đăng ký Smart Penguin Insights để nhận insight crypto mỗi tuần"
  cta_v: "Xem full trên YouTube · @Trong0322"
  voice_primary: "gemini:Riko"       # giọng chính (Storyteller, dùng key INSIGHT_GEMINI_API_KEY)
  voice_fallback: "vieneu:Hải Đăng"  # chỉ dùng khi Gemini hết lượt — cả video đổi sang giọng này
  voice_speed: {gemini: auto, vieneu: auto}   # auto = tự chỉnh về ~target_wpm từ/phút; hoặc số, vd 1.05
  target_wpm: 215
  tts_provider: "gemini"      # (bộ dựng cũ) "gemini" hoặc "vieneu"
  vieneu_voice: "Hải Đăng"
  voice: "Riko"
  voice_style: ""             # để trống = đọc tự nhiên
  host_name: ""               # tên người dẫn (để trống = không xưng tên)
  host_desc: "điềm đạm, sâu sắc, gần gũi như một người anh đi trước chia sẻ kinh nghiệm"
  self_word: "mình"
  audience: "mọi người"
  min_posts: 3                # đủ bao nhiêu link thì tối đó tự cook video
  max_posts: 8                # mỗi video dùng tối đa bao nhiêu bài
  max_sections: 6             # số insight tối đa trong 1 video
  target_minutes: 7
  shorts: 3                   # số video ngắn highlight
  shorts_max_seconds: 55
  cook_hours: [19, 23]        # khung giờ (VN) được phép cook tự động
