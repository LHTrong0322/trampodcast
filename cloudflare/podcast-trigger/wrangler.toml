name = "tram-podcast-trigger"
main = "worker.js"
compatibility_date = "2026-11-01"

[triggers]
# Giờ UTC: 22:00 = 5:00 sáng VN, 22:20 = 5:20 sáng VN (dự phòng)
# 5,20,35,50 mỗi giờ: bấm social-schedule.yml đăng comment đúng giờ (Trọng 26/11)
crons = ["0 22 * * *", "20 22 * * *", "5,20,35,50 * * * *"]
