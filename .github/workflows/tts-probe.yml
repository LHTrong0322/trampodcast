name: "Thử giọng 1 câu (xem Gemini có đọc lặp thật không)"

on:
  workflow_dispatch:
    inputs:
      texts:
        description: "Các câu cần thử, ngăn cách bởi ||"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy faster-whisper
      - name: Đọc thử + nghe lại
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
          PROBE_TEXTS: ${{ github.event.inputs.texts }}
        run: python tts_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: tts-probe
          path: probe/*.wav
