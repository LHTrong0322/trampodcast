name: "Kiểm tra lấy giá BTC tuần (biểu đồ 200WMA)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy
      - name: Lấy giá BTC tuần, tính 200WMA và 350WMA
        run: |
          python -c "
          import insight_lab as L
          rows = L._btc_weekly()
          print('so tuan', len(rows), rows[:1], rows[-1:])
          d = {}
          L.wma_data({'sections': [{'beats': [{'type': 'wma'}]}]}, d)
          w = d.get('wma') or {}
          print('OK' if w else 'KHONG CO', len(w.get('price') or []), w.get('now'), w.get('now200'), w.get('now350'))
          "
