name: Thử giọng (gửi nhiều mẫu vào Telegram)

on:
  workflow_dispatch:
    inputs:
      vieneu:
        description: "Các giọng VieNeu (cách nhau bởi dấu phẩy)"
        required: false
        default: ""
      gemini:
        description: "Các giọng Gemini (tốn lượt Gemini, mỗi giọng 1 lượt), để trống = không thử"
        required: false
        default: ""
      no_send:
        description: "Giọng chỉ đo thông số, không gửi lại Telegram"
        required: false
        default: ""
      text:
        description: "Đoạn đọc thử (để trống = đoạn tin mẫu)"
        required: false
        default: ""

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests feedparser pyyaml beautifulsoup4 numpy vieneu
      - name: Đọc thử + gửi Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python voice_samples.py --vieneu "${{ github.event.inputs.vieneu }}" --gemini "${{ github.event.inputs.gemini }}" --text "${{ github.event.inputs.text }}" --no-send "${{ github.event.inputs.no_send }}"
