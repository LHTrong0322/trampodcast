name: Phụ đề YouTube (xem / gỡ phụ đề tự động)

on:
  workflow_dispatch:
    inputs:
      video:
        description: "ID video YouTube"
        required: true
      action:
        description: "list = chỉ xem, delete_asr = gỡ phụ đề tự động"
        required: true
        default: "list"

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - name: Phụ đề
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: python
        run: |
          import os, requests
          t = requests.post("https://oauth2.googleapis.com/token", data={"client_id": os.environ["YT_CLIENT_ID"].strip(),
              "client_secret": os.environ["YT_CLIENT_SECRET"].strip(), "refresh_token": os.environ["YT_REFRESH_TOKEN"].strip(),
              "grant_type": "refresh_token"}).json()["access_token"]
          H = {"Authorization": "Bearer " + t}
          vid, act = "${{ github.event.inputs.video }}", "${{ github.event.inputs.action }}"
          items = requests.get("https://www.googleapis.com/youtube/v3/captions", params={"part": "snippet", "videoId": vid}, headers=H).json().get("items", [])
          for c in items:
              sn = c["snippet"]
              print("PHỤ ĐỀ:", sn.get("language"), "|", sn.get("trackKind"), "|", sn.get("status"), "|", sn.get("name") or "-")
              if act == "delete_asr" and sn.get("trackKind") == "asr":
                  r = requests.delete("https://www.googleapis.com/youtube/v3/captions", params={"id": c["id"]}, headers=H)
                  print("GỠ PHỤ ĐỀ TỰ ĐỘNG:", "OK" if r.status_code in (200, 204) else f"LỖI {r.status_code} {r.text[:200]}")
          if not items:
              print("PHỤ ĐỀ: không còn track nào")
