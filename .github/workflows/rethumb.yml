name: "Vẽ lại ảnh bìa kiểu mới cho video đã dựng"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mã video, vd 20261124-0919"
        required: true
      script:
        description: "Kịch bản đã duyệt, vd scripts/100y-btc-approved.json"
        required: true

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cài Remotion
        working-directory: remotion
        run: npm ci --silent
      - name: Vẽ ảnh bìa
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rethumb.py "${{ github.event.inputs.tag }}" "${{ github.event.inputs.script }}"
      - name: Lưu ảnh bìa vào repo
        run: |
          git config user.name "tram-podcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/posts/thumbs assets/posts
          git diff --cached --quiet && exit 0
          git commit -q -m "Ảnh bìa mới ${{ github.event.inputs.tag }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
