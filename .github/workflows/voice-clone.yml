name: Nhân bản giọng Mai Thảo, Mai Linh (VieNeu, miễn phí)

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests feedparser pyyaml beautifulsoup4 numpy vieneu
      - name: Lấy giọng mẫu từ Telegram, đọc thử, gửi lại
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u voice_clone.py
