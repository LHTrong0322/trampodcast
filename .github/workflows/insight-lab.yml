name: Trạm Insight LAB (chuẩn bị nguyên liệu thử nhiều kiểu dựng)

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Link bài X"
        required: true
      voices:
        description: "Giọng: provider:tên, cách nhau dấu phẩy"
        required: false
        default: "vieneu:Hải Đăng,gemini:Ludo"
      allow_main_key:
        description: "Cho dùng key Gemini chính nếu chưa có INSIGHT key (tốn lượt podcast), 1/0"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy vieneu
      - name: Kiểm tra key
        env:
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
        run: |
          if [ -n "$INSIGHT_GEMINI_API_KEY" ]; then echo "INSIGHT key: CÓ"; else echo "INSIGHT key: CHƯA CÓ"; fi
      - name: Chuẩn bị nguyên liệu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ALLOW_MAIN_KEY: ${{ github.event.inputs.allow_main_key }}
          GH_TOKEN: ${{ github.token }}
        run: python insight_lab.py prepare --links "${{ github.event.inputs.links }}" --voices "${{ github.event.inputs.voices }}"
