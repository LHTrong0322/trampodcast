name: "Kiểm tra video đã dựng (nghe lại, tìm chỗ lặp)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tên release, vd insight-20261121-1518"
        required: true
      script:
        description: "Kịch bản để so, vd scripts/zeroxkyle-approved.json"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
      - name: Tải video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.inputs.tag }}" -p "*16x9.mp4" -O video.mp4
      - name: Nghe lại và tìm chỗ lặp
        run: python tts_qa.py video.mp4 ${{ github.event.inputs.script }}
