name: Trạm Podcast Crypto, tạo tập podcast

on:
  schedule:
    # 1 tập/ngày lúc 5:02 sáng VN (22:02 giờ UTC). Lệch 2 phút khỏi giờ chẵn vì
    # GitHub hay dồn việc đúng phút :00. GitHub có thể vẫn chạy trễ vào giờ cao điểm.
    - cron: "2 22 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Lấy tin trong bao nhiêu giờ gần nhất (để trống = tự động)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Lấy dữ liệu các tập cũ (nhánh podcast-data)
        run: |
          git clone --depth 1 --branch podcast-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" public \
            || mkdir -p public
          rm -rf public/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests feedparser pyyaml beautifulsoup4 telethon pillow numpy

      - name: Gom tin → AI biên tập → đọc audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
          GEMINI_API_KEY6: ${{ secrets.GEMINI_API_KEY6 }}
          GEMINI_API_KEY7: ${{ secrets.GEMINI_API_KEY7 }}
          GEMINI_API_KEY8: ${{ secrets.GEMINI_API_KEY8 }}
          GEMINI_API_KEY9: ${{ secrets.GEMINI_API_KEY9 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          SITE_URL: ${{ vars.SITE_URL }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          SCRIPT=podcast.py
          [ -f scripts/podcast.py ] && SCRIPT=scripts/podcast.py
          if [ -n "${{ github.event.inputs.hours }}" ]; then
            python "$SCRIPT" --out public --hours "${{ github.event.inputs.hours }}"
          else
            python "$SCRIPT" --out public
          fi

      # Trọng 23/11: đã bỏ bước làm sẵn đoạn video của ngày (video tổng hợp tuần đã dừng)

      - name: Lưu & xuất bản lên nhánh podcast-data
        run: |
          cd public
          git init -q -b podcast-data
          git config user.name "tram-podcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Cập nhật podcast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" podcast-data
