name: Trạm Insight (link X → video chia sẻ insight)

on:
  schedule:
    # Mỗi 3 tiếng: đọc link mới bạn gửi vào bot Telegram (Telegram chỉ giữ tin nhắn 24h).
    # Nếu đủ link và đang trong khung giờ cook (19h–23h VN) hoặc bạn gửi /cook → dựng video.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Cook video ngay với các link đang chờ (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lấy dữ liệu (nhánh podcast-data)
        run: |
          git clone --depth 1 --branch podcast-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" public
          rm -rf public/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện cơ bản
        run: pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy

      - name: Đọc link mới từ Telegram
        id: inbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python insight.py inbox --out public --force
          else
            python insight.py inbox --out public
          fi

      - name: Cài ffmpeg
        if: steps.inbox.outputs.cook == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Cook video Insight + gửi Telegram
        if: steps.inbox.outputs.cook == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python insight.py cook --out public --force

      - name: Lưu dữ liệu (nhánh podcast-data)
        if: always()
        run: |
          rm -rf public/insight/render public/video/weekly
          cd public
          git init -q -b podcast-data
          git config user.name "tram-podcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Trạm Insight $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" podcast-data
