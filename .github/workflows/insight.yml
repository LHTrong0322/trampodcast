name: Smart Penguin Insights (link X → video insight + shorts)

on:
  schedule:
    # Mỗi 3 tiếng: đọc link mới bạn gửi vào bot Telegram (Telegram chỉ giữ tin nhắn 24h).
    # Nếu đủ link và đang trong khung giờ cook (19h–23h VN) hoặc bạn gửi /cook → dựng video.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Cook video ngay với các link đang chờ (true/false)"
        required: false
        default: "false"
      links:
        description: "Thêm link bài X trực tiếp (cách nhau bởi dấu cách) — không bắt buộc"
        required: false
        default: ""
      themes:
        description: "Dựng nhiều kiểu nền để so sánh (vd light,blue,slate) — để trống = theo sources.yaml"
        required: false
        default: ""
      voice:
        description: "Ép giọng (vd vieneu:Hải Đăng hoặc gemini:Riko) — để trống = Riko, hết lượt thì Hải Đăng"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Lấy dữ liệu (nhánh podcast-data)
        run: |
          git clone --depth 1 --branch podcast-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" public
          rm -rf public/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện cơ bản
        run: pip install -q requests feedparser pyyaml beautifulsoup4 pillow numpy

      - name: Đọc link mới từ Telegram
        id: inbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="--force"
          python insight.py inbox --out public $ARGS --links "${{ github.event.inputs.links }}"

      - name: Cài ffmpeg + giọng dự phòng
        if: steps.inbox.outputs.cook == 'true' || github.event.inputs.links != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q vieneu

      - uses: actions/setup-node@v4
        if: steps.inbox.outputs.cook == 'true' || github.event.inputs.links != ''
        with:
          node-version: "22"

      - name: Cài Remotion (bộ dựng video) + Claude Code (bot review)
        if: steps.inbox.outputs.cook == 'true' || github.event.inputs.links != ''
        working-directory: remotion
        run: |
          npm ci --silent
          npm i -g --silent @anthropic-ai/claude-code

      - name: Cook video Insight + gửi Telegram
        if: steps.inbox.outputs.cook == 'true' || github.event.inputs.links != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSIGHT_GEMINI_API_KEY: ${{ secrets.INSIGHT_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          INSIGHT_VOICE: ${{ github.event.inputs.voice }}
          INSIGHT_THEMES: ${{ github.event.inputs.themes }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python insight.py cook --out public --force --links "${{ github.event.inputs.links }}"

      - name: Lưu dữ liệu (nhánh podcast-data)
        if: always()
        run: |
          rm -rf public/insight/render public/video/weekly
          cd public
          git init -q -b podcast-data
          git config user.name "tram-podcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Trạm Insight $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" podcast-data
